[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolioiq"
version = "0.1.0"
description = "Long-short S&P 500 strategy driven by NLP signals from 10-K filings"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2,<2.3",
    "numpy>=1.26,<2.0",
    "pyarrow>=15",
    "duckdb>=1.1,<1.2",
    "dbt-core>=1.9,<1.10",
    "dbt-duckdb>=1.9,<1.10",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "html5lib>=1.1",
    "yfinance>=0.2.50",
    "transformers>=4.44,<4.50",
    "torch>=2.3",
    "gensim>=4.3.3",
    "scipy>=1.11,<1.14",
    "scikit-learn>=1.4,<1.6",
    "xgboost>=2.0,<2.2",
    "shap>=0.46",
    "cvxpy>=1.5",
    "statsmodels>=0.14",
    "mlflow>=2.16,<3.0",
    "matplotlib>=3.8",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "detect-secrets>=1.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["dbt", "mlruns", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
