name: portfolioiq
version: "1.0.0"
config-version: 2
profile: portfolioiq

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target"]

vars:
  data_dir: "../data/processed/sample"
  interim_dir: "../data/interim"
  reports_dir: "../reports"
  run_name: "sample"
  delist_return_acquisition: 0.0
  delist_return_unknown: -0.30
  max_filing_age_months: 15

models:
  portfolioiq:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table
